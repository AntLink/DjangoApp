    // Global configuration
    let config = {

    // Save configuration
    function saveConfig() {

        config.baseUrl = baseUrlInput.value.trim();

    // Load configuration
    function loadConfig() {
        try {
            const savedConfig = localStorage.getItem('ckeditor_config');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
                document.getElementById('base-url').value = config.baseUrl;

    // Debug function to log to status
    function debugLog(message) {
        console.log(message);
        const statusInfo = document.getElementById('status-info');
        statusInfo.textContent = `Status: ${message}`;
    }

    // Enhanced Token Manager with server-driven token lifetimes
    class SimpleTokenManager {
        constructor(config = {}) {
            this.config = {
                tokenUrl: config.tokenUrl || '/api/auth/ckbox_login',
                refreshTokenUrl: config.refreshTokenUrl || '/api/auth/ckbox_token_refresh',
                ...config
            };
            this.token = null;
            this.refreshToken = null;
            this.tokenExpiry = null;
            this.refreshTokenExpiry = null;
            this.refreshTimeout = null;
            this.isRefreshing = false;
            this.refreshQueue = [];
        }

        getToken() {
            const tokenData = localStorage.getItem('ckeditor_token');
            debugLog(`Getting token from localStorage: ${tokenData ? 'Found' : 'Not found'}`);

            if (tokenData) {
                try {
                    const parsed = JSON.parse(tokenData);
                    this.token = parsed.token;
                    this.refreshToken = parsed.refreshToken;
                    this.tokenExpiry = parsed.expiry;
                    this.refreshTokenExpiry = parsed.refreshExpiry;

                    debugLog(`Token parsed. Valid: ${this.isTokenValid()}, Refresh valid: ${this.isRefreshTokenValid()}`);
                    return this.token;
                } catch (e) {
                    debugLog(`Error parsing token data: ${e.message}`);
                    this.clearToken();
                }
            }
            return null;
        }

        saveToken(token, refreshToken, expiry, refreshExpiry) {
            const tokenData = {
                token,
                refreshToken,
                expiry,
                refreshExpiry
            };
            localStorage.setItem('ckeditor_token', JSON.stringify(tokenData));
            debugLog(`Token saved to localStorage. Access expires: ${new Date(expiry).toLocaleString()}, Refresh expires: ${new Date(refreshExpiry).toLocaleString()}`);

            this.token = token;
            this.refreshToken = refreshToken;
            this.tokenExpiry = expiry;
            this.refreshTokenExpiry = refreshExpiry;

            this.setAutoRefresh();
        }

        clearToken() {
            localStorage.removeItem('ckeditor_token');
            this.token = null;
            this.refreshToken = null;
            this.tokenExpiry = null;
            this.refreshTokenExpiry = null;
            if (this.refreshTimeout) {
                clearTimeout(this.refreshTimeout);
                this.refreshTimeout = null;
            }
            debugLog('Token cleared');
        }

        isTokenValid() {
            if (!this.tokenExpiry) return false;
            // Add a small buffer (5 seconds) to account for network latency
            const isValid = Date.now() < (this.tokenExpiry - 5000);
            debugLog(`Token valid: ${isValid} (Current: ${new Date().toISOString()}, Expires: ${new Date(this.tokenExpiry).toISOString()})`);
            return isValid;
        }

        isRefreshTokenValid() {
            if (!this.refreshTokenExpiry) return false;
            const isValid = Date.now() < this.refreshTokenExpiry;
            debugLog(`Refresh token valid: ${isValid}`);
            return isValid;
        }

        setAutoRefresh() {
            if (this.refreshTimeout) {
                clearTimeout(this.refreshTimeout);
            }

            if (!this.tokenExpiry) return;

            // Try to refresh 30 seconds before expiry
            const refreshTime = Math.max(0, this.tokenExpiry - Date.now() - 30 * 1000);

            debugLog(`Auto-refresh scheduled in ${Math.round(refreshTime / 1000)} seconds`);

            this.refreshTimeout = setTimeout(() => {
                this.refreshAccessToken();
            }, refreshTime);
        }

        async refreshAccessToken() {
            // If already refreshing, return the same promise
            if (this.isRefreshing) {
                debugLog('Token refresh already in progress, adding to queue');
                return new Promise((resolve, reject) => {
                    this.refreshQueue.push({resolve, reject});
                });
            }

            this.isRefreshing = true;
            debugLog('Refreshing token...');

            if (!this.refreshToken || !this.isRefreshTokenValid()) {
                debugLog('Refresh token not valid, clearing token');
                this.clearToken();
                this.isRefreshing = false;
                return null;
            }

            try {
                const url = `${config.baseUrl}${this.config.refreshTokenUrl}`;
                debugLog(`Refreshing token at: ${url}`);

                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${this.token}`
                    },
                    body: JSON.stringify({refresh: this.refreshToken})
                });

                debugLog(`Refresh response status: ${response.status}`);

                if (response.ok) {
                    const data = await response.json();
                    debugLog('Refresh successful, saving new token');

                    // Calculate expiry times based on server response
                    const tokenExpiry = Date.now() + (data.access_token_lifetime * 1000);
                    const refreshExpiry = Date.now() + (data.refresh_token_lifetime * 1000);

                    this.saveToken(
                        data.access,
                        data.refresh || this.refreshToken, // Use new refresh token if provided, otherwise keep the old one
                        tokenExpiry,
                        refreshExpiry
                    );

                    // Resolve all queued promises
                    this.refreshQueue.forEach(({resolve}) => resolve(this.token));
                    this.refreshQueue = [];

                    this.isRefreshing = false;
                    return this.token;
                } else {
                    debugLog(`Refresh failed with status ${response.status}`);
                    this.clearToken();

                    // Reject all queued promises
                    this.refreshQueue.forEach(({reject}) => reject(new Error('Token refresh failed')));
                    this.refreshQueue = [];

                    this.isRefreshing = false;
                    return null;
                }
            } catch (error) {
                debugLog(`Error refreshing token: ${error.message}`);
                this.clearToken();

                // Reject all queued promises
                this.refreshQueue.forEach(({reject}) => reject(error));
                this.refreshQueue = [];

                this.isRefreshing = false;
                return null;
            }
        }

        async getTokenForCKBox() {
            let token = this.getToken();

            if (!token || !this.isTokenValid()) {
                debugLog('Token not valid, attempting refresh...');
                token = await this.refreshAccessToken();
            }

            if (!token) {
                throw new Error('Unable to retrieve a token from the callback.');
            }

            return token;
        }

        async login(username, password) {
            debugLog(`Attempting login for user: ${username}`);

            try {
                const url = `${config.baseUrl}${this.config.tokenUrl}`;
                debugLog(`Login attempt at: ${url}`);

                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({username, password})
                });

                debugLog(`Login response status: ${response.status}`);

                if (response.ok) {
                    const data = await response.json();
                    debugLog('Login successful, saving tokens');

                    // Calculate expiry times based on server response
                    const tokenExpiry = Date.now() + (data.access_token_lifetime * 1000);
                    const refreshExpiry = Date.now() + (data.refresh_token_lifetime * 1000);

                    this.saveToken(
                        data.access,
                        data.refresh,
                        tokenExpiry,
                        refreshExpiry
                    );
                    return true;
                } else {
                    let errorMessage = 'Login failed';
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        errorMessage = await response.text();
                    }
                    debugLog(`Login failed: ${errorMessage}`);
                    throw new Error(errorMessage);
                }
            } catch (error) {
                debugLog(`Login error: ${error.message}`);
                throw error;
            }
        }

        logout() {
            debugLog('Logging out...');
            this.clearToken();
        }
    }

    function showLoginOverlay() {
        debugLog('Showing login overlay');

        // Remove existing overlay
        const existingOverlay = document.querySelector('.ck-login-overlay');
        if (existingOverlay) {
            existingOverlay.remove();
        }

        // Create new overlay
        const overlay = document.createElement('div');
        overlay.className = 'ck-login-overlay';
        overlay.innerHTML = `
            <div class="ck-login-form">
                <h3>Login to your System</h3>
                <form id="ckeditor-login-form">
                    <div class="ck-form-group">
                        <label>Username:</label>
                        <input type="text" id="ckeditor-username" value="antlink" required>
                    </div>
                    <div class="ck-form-group">
                        <label>Password:</label>

                    </div>
                    <div class="ck-form-actions">
                        <button type="button" class="ck-button ck-button-cancel" id="cancel-login">Cancel</button>
                        <button type="submit" class="ck-button ck-button-action">Login</button>
                    </div>
                </form>
                <div class="debug-info" id="login-debug"></div>
            </div>
        `;

        document.body.appendChild(overlay);

        // Handle form submission
        document.getElementById('ckeditor-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('ckeditor-username').value;
            const password = document.getElementById('ckeditor-password').value;
            const debugDiv = document.getElementById('login-debug');

            debugDiv.textContent = 'Attempting login...';

            try {
                debugLog(`Login attempt with username: ${username}`);
                await tokenManager.login(username, password);
                debugDiv.textContent = 'Login successful! Reloading page...';
                overlay.remove();
                debugLog('Login successful, reloading page');

                // Reload page to reinitialize editor with CKBox
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } catch (error) {
                debugDiv.textContent = `Login failed: ${error.message}`;
                debugLog(`Login failed: ${error.message}`);
                alert(`Login failed: ${error.message}`);
            }
        });

        // Handle cancel button
        document.getElementById('cancel-login').addEventListener('click', () => {
            overlay.remove();
        });
    }

    // Create token URL function for CKBox
    function createTokenUrlFunction() {
        return async () => {
            try {
                debugLog('CKBox requesting token...');

                // Selalu coba dapatkan token terbaru dari manager
                let token = await tokenManager.getTokenForCKBox();

                debugLog('CKBox token obtained successfully');
                console.log('CKBox token:', token ? token.substring(0, 20) + '...' : 'null');
                return token;
            } catch (error) {
                debugLog(`CKBox token error: ${error.message}`);
                showLoginOverlay();
                throw error;
            }
        };
    }

    // Create token refresh function for CKBox
    function createTokenRefreshFunction() {
        return async (oldToken) => {
            try {
                debugLog('CKBox refreshing token...');
                debugLog(`Old token: ${oldToken ? oldToken.substring(0, 20) + '...' : 'null'}`);

                // Refresh token menggunakan token manager
                const newToken = await tokenManager.refreshAccessToken();

                if (newToken) {
                    debugLog('CKBox token refreshed successfully');
                    console.log('New CKBox token:', newToken.substring(0, 20) + '...');
                    return newToken;
                }

                throw new Error('Token refresh failed');
            } catch (error) {
                debugLog(`CKBox token refresh error: ${error.message}`);
                showLoginOverlay();
                throw error;
            }
        };
    }

                    logoutButton.style.display = 'block';
                }

                // Enhanced CKBox error handling
                editor.plugins.get('CKBox').on('error:token', (evt, data) => {
                    debugLog(`CKBox token error detected: ${JSON.stringify(data)}`);

                    // Try to refresh token first
                    tokenManager.refreshAccessToken().then(newToken => {
                        if (newToken) {
                            debugLog('Token refreshed successfully after CKBox error');

                            // Update CKBox configuration with new token
                            editor.config.set('ckbox.tokenUrl', createTokenUrlFunction());

                            // Reinitialize CKBox plugin
                            const ckboxPlugin = editor.plugins.get('CKBox');
                            if (ckboxPlugin) {
                                ckboxPlugin.init();
                            }
                        } else {
                            debugLog('Token refresh failed, showing login');
                            showLoginOverlay();
                        }
                    }).catch(error => {
                        debugLog(`Failed to refresh token after CKBox error: ${error.message}`);
                        showLoginOverlay();
                    });
                });

                // Handle token refresh events
                editor.plugins.get('CKBox').on('tokenRefreshed', (evt, data) => {
                    debugLog('CKBox token refreshed successfully');
                    updateStatus('Token refreshed');
                });

                // Monitor token changes and update CKBox
                setInterval(() => {
                    const currentToken = tokenManager.getToken();
                    if (currentToken && currentToken !== editor.config._config.ckbox.tokenUrl) {
                        debugLog('Token changed, updating CKBox configuration');
                        editor.config.set('ckbox.tokenUrl', createTokenUrlFunction());
                    }
                }, 5000); // Check every 5 seconds

                // Fix untuk masalah spasi - tambahkan event listener untuk menangani input spasi
                editor.editing.view.document.on('keydown', (event, data) => {
                    if (data.domEvent.key === ' ') {
                        // Pastikan spasi tidak dicegah oleh event handler lain
                        data.domEvent.preventDefault = () => {};
                    }
                }, { priority: 'high' });
            })
            .catch(error => {
                debugLog(`Error initializing CKEditor: ${error.message}`);
            });
    }

    // Initialize when the page is fully loaded
    window.addEventListener('load', function() {
        // Load configuration first
        loadConfig();
        initializeTokenManager();

        debugLog('Page fully loaded, checking authentication...');

        const token = tokenManager.getToken();
        console.log('format token', token);
        const logoutButton = document.getElementById('logout-button');

        if (token && tokenManager.isTokenValid()) {
            debugLog('User authenticated, initializing editor with CKBox...');
            logoutButton.style.display = 'block';
            initializeEditor();
        } else {
            debugLog('User not authenticated, showing login form...');
            logoutButton.style.display = 'none';

            // Show login form immediately
            showLoginOverlay();

            // Initialize editor without CKBox first
            const {
                ClassicEditor,
                Essentials,
                Paragraph,
                Bold,
                Italic,
                Underline,
                Strikethrough,
                Code,
                Link,
                List,
                Indent,
                IndentBlock,
                BlockQuote,
                Heading,
                FontSize,
                FontFamily,
                FontColor,
                FontBackgroundColor,
                Alignment,
                Table,
                TableToolbar,
                ImageUpload,
                MediaEmbed,
                SourceEditing,
                Fullscreen,
                FindAndReplace,
                Typing
            } = window.CKEDITOR;

            ClassicEditor
                .create(document.querySelector('#editor'), {
                    plugins: [
                        Essentials,
                        Paragraph,
                        Bold,
                        Italic,
                        Underline,
                        Strikethrough,
                        Code,
                        Link,
                        List,
                        Indent,
                        IndentBlock,
                        BlockQuote,
                        Heading,
                        FontSize,
                        FontFamily,
                        FontColor,
                        FontBackgroundColor,
                        Alignment,
                        Table,
                        TableToolbar,
                        ImageUpload,
                        MediaEmbed,
                        SourceEditing,
                        Fullscreen,
                        FindAndReplace,
                        Typing
                    ],
                    toolbar: [
                        'heading', '|', 'bold', 'italic', 'underline', 'strikethrough', '|',
                        'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', '|',
                        'link', 'bulletedList', 'numberedList', 'outdent', 'indent', '|',
                        'blockQuote', 'insertTable', '|', 'sourceEditing', 'fullscreen', '|',
                        'findAndReplace'
                    ],
                    // Fix untuk masalah spasi
                    typing: {
                        transformations: {
                            remove: [
                                // Nonaktifkan transformasi yang mungkin mengganggu input spasi
                                'symbols',
                                'quotes',
                                'mathematicalSymbols',
                                'arrows',
                                'miscellaneous'
                            ]
                        }
                    }
                })
                .then(editor => {
                    debugLog('CKEditor initialized without CKBox');
                    window.currentEditor = editor;

                    // Fix untuk masalah spasi - tambahkan event listener untuk menangani input spasi
                    editor.editing.view.document.on('keydown', (event, data) => {
                        if (data.domEvent.key === ' ') {
                            // Pastikan spasi tidak dicegah oleh event handler lain
                            data.domEvent.preventDefault = () => {};
                        }
                    }, { priority: 'high' });
                })
                .catch(error => {
                    debugLog(`Error initializing CKEditor without CKBox: ${error.message}`);
                });
        }

        // Logout button handler
        logoutButton.addEventListener('click', () => {
            tokenManager.logout();
            logoutButton.style.display = 'none';
            location.reload();
        });
    });
</script>
</body>
</html>
