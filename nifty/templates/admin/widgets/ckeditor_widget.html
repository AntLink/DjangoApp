<script>
    function hexToHSL(hex) {
        let r = parseInt(hex.slice(1, 3), 16) / 255;
        let g = parseInt(hex.slice(3, 5), 16) / 255;
        let b = parseInt(hex.slice(5, 7), 16) / 255;

        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0; // abu-abu
        } else {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r:
                    h = (g - b) / d + (g < b ? 6 : 0);
                    break;
                case g:
                    h = (b - r) / d + 2;
                    break;
                case b:
                    h = (r - g) / d + 4;
                    break;
            }
            h /= 6;
        }

        return {
            h: Math.round(h * 360),
            s: Math.round(s * 100),
            l: Math.round(l * 100)
        };
    }

    // ambil nilai dari CSS variable
    const rootStyles = getComputedStyle(document.documentElement);
    const hexColor = rootStyles.getPropertyValue("--bs-primary").trim();

    // konversi hex → hsl
    const hsl = hexToHSL(hexColor);
    console.log('hsl baru', hsl);
    // isi ke dalam .header
    document.querySelectorAll(".ckbox").forEach(el => {
        el.style.setProperty("--ckbox-action-h", hsl.h, "important");
        el.style.setProperty("--ckbox-action-s", hsl.s + "%", "important");
    });

    const styleTag = document.getElementById("ckbox-style");
    styleTag.textContent = `.ckbox {--ckbox-action-h: ${hsl.h};--ckbox-action-s: ${hsl.s}%;}`;
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const config = {{ widget.config_json|safe }};
        const editorId = '{{ widget.attrs.id }}';
        const inputId = editorId + '-input';

        // Fungsi untuk memperbarui nilai input
        function updateInputValue(editor) {
            const editorData = editor.getData();
            document.getElementById(inputId).value = editorData;
        }

        // Global configuration
        let ckConfig = {
            baseUrl: config.baseUrl
        };


        // Enhanced Token Manager with server-driven token lifetimes
        class TokenManager {
            constructor(config = {}) {
                this.config = {
                    tokenUrl: config.tokenUrl || '/api/auth/ckbox_login',
                    refreshTokenUrl: config.refreshTokenUrl || '/api/auth/ckbox_token_refresh',
                    ...config
                };
                this.token = null;
                this.refreshToken = null;
                this.tokenExpiry = null;
                this.refreshTokenExpiry = null;
                this.refreshTimeout = null;
                this.isRefreshing = false;
                this.refreshQueue = [];
            }

            getToken() {
                const tokenData = localStorage.getItem('ckbox_token');
                console.log(`Getting token from localStorage: ${tokenData ? 'Found' : 'Not found'}`);

                if (tokenData) {
                    try {
                        const parsed = JSON.parse(tokenData);
                        this.token = parsed.token;
                        this.refreshToken = parsed.refreshToken;
                        this.tokenExpiry = parsed.expiry;
                        this.refreshTokenExpiry = parsed.refreshExpiry;

                        console.log(`Token parsed. Valid: ${this.isTokenValid()}, Refresh valid: ${this.isRefreshTokenValid()}`);
                        return this.token;
                    } catch (e) {
                        console.log(`Error parsing token data: ${e.message}`);
                        //this.clearToken();
                    }
                }
                return null;
            }

            saveToken(token, refreshToken, expiry, refreshExpiry) {
                const tokenData = {
                    token,
                    refreshToken,
                    expiry,
                    refreshExpiry
                };
                localStorage.setItem('ckbox_token', JSON.stringify(tokenData));
                console.log(`Token saved to localStorage. Access expires: ${new Date(expiry).toLocaleString()}, Refresh expires: ${new Date(refreshExpiry).toLocaleString()}`);

                this.token = token;
                this.refreshToken = refreshToken;
                this.tokenExpiry = expiry;
                this.refreshTokenExpiry = refreshExpiry;

                this.setAutoRefresh();
            }

            clearToken() {
                localStorage.removeItem('ckbox_token');
                this.token = null;
                this.refreshToken = null;
                this.tokenExpiry = null;
                this.refreshTokenExpiry = null;
                if (this.refreshTimeout) {
                    clearTimeout(this.refreshTimeout);
                    this.refreshTimeout = null;
                }
                console.log('Token cleared');
            }

            isTokenValid() {
                if (!this.tokenExpiry) return false;
                const isValid = Date.now() < (this.tokenExpiry - 5000);
                console.log(`Token valid: ${isValid} (Current: ${new Date().toISOString()}, Expires: ${new Date(this.tokenExpiry).toISOString()})`);
                return isValid;
            }

            isRefreshTokenValid() {
                if (!this.refreshTokenExpiry) return false;
                const isValid = Date.now() < this.refreshTokenExpiry;
                console.log(`Refresh token valid: ${isValid}`);
                return isValid;
            }

            setAutoRefresh() {
                if (this.refreshTimeout) {
                    clearTimeout(this.refreshTimeout);
                }

                if (!this.tokenExpiry) return;

                const refreshTime = Math.max(0, this.tokenExpiry - Date.now() - 30 * 1000);
                console.log(`Auto-refresh scheduled in ${Math.round(refreshTime / 1000)} seconds`);

                this.refreshTimeout = setTimeout(() => {
                    this.refreshAccessToken();
                }, refreshTime);
            }

            async refreshAccessToken() {
                if (this.isRefreshing) {
                    console.log('Token refresh already in progress, adding to queue');
                    return new Promise((resolve, reject) => {
                        this.refreshQueue.push({resolve, reject});
                    });
                }

                this.isRefreshing = true;
                console.log('Refreshing token...');

                if (!this.refreshToken || !this.isRefreshTokenValid()) {
                    console.log('Refresh token not valid, clearing token');
                    //this.clearToken();
                    this.isRefreshing = false;
                    return null;
                }

                try {
                    const url = `${ckConfig.baseUrl}${this.config.refreshTokenUrl}`;
                    console.log(`Refreshing token at: ${url}`);

                    const response = await fetch(url, {
                        method: 'POST',
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.token}`
                        },
                        body: JSON.stringify({refresh: this.refreshToken})
                    });

                    console.log(`Refresh response status: ${response.status}`);

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Refresh successful, saving new token');

                        const tokenExpiry = Date.now() + (data.access_token_lifetime * 1000);
                        const refreshExpiry = Date.now() + (data.refresh_token_lifetime * 1000);

                        this.saveToken(
                            data.access,
                            data.refresh || this.refreshToken,
                            tokenExpiry,
                            refreshExpiry
                        );

                        this.refreshQueue.forEach(({resolve}) => resolve(this.token));
                        this.refreshQueue = [];

                        this.isRefreshing = false;
                        return this.token;
                    } else {
                        console.log(`Refresh failed with status ${response.status}`);
                        // this.clearToken();
                        const skl = document.querySelector('.ckbox-wrapper');
                        skl.hidden();
                        this.refreshQueue.forEach(({reject}) => reject(new Error('Token refresh failed')));
                        this.refreshQueue = [];

                        this.isRefreshing = false;
                        return null;
                    }
                } catch (error) {
                    console.log(`Error refreshing token: ${error.message}`);
                    //this.clearToken();
                    this.refreshQueue.forEach(({reject}) => reject(error));
                    this.refreshQueue = [];

                    this.isRefreshing = false;
                    return null;
                }
            }

            async getTokenForCKBox() {
                let token = this.getToken();

                if (!token || !this.isTokenValid()) {
                    console.log('Token not valid, attempting refresh...');
                    token = await this.refreshAccessToken();
                }

                if (!token) {
                    throw new Error('Unable to retrieve a token from the callback.');
                }

                return token;
            }

            async login(username, password) {
                console.log(`Attempting login for user: ${username}`);

                try {
                    const url = `${ckConfig.baseUrl}${this.config.tokenUrl}`;
                    console.log(`Login attempt at: ${url}`);

                    const response = await fetch(url, {
                        method: 'POST',
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({username, password})
                    });

                    console.log(`Login response status: ${response.status}`);

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Login successful, saving tokens');

                        const tokenExpiry = Date.now() + (data.access_token_lifetime * 1000);
                        const refreshExpiry = Date.now() + (data.refresh_token_lifetime * 1000);

                        this.saveToken(
                            data.access,
                            data.refresh,
                            tokenExpiry,
                            refreshExpiry
                        );
                        return true;
                    } else {
                        let errorMessage = 'Login failed';
                        try {
                            const errorData = await response.json();
                            errorMessage = errorData.error || errorMessage;
                        } catch (e) {
                            errorMessage = await response.text();
                        }
                        console.log(`Login failed: ${errorMessage}`);
                        throw new Error(errorMessage);
                    }
                } catch (error) {
                    console.log(`Login error: ${error.message}`);
                    throw error;
                }
            }

            logout() {
                console.log('Logging out...');
                this.clearToken();
            }
        }

        // Initialize token manager
        let tokenManager;

        function initializeTokenManager() {
            tokenManager = new TokenManager({
                tokenUrl: config.tokenUrl,
                refreshTokenUrl: config.refreshTokenUrl
            });
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('ckbox-username').value;
            const password = document.getElementById('ckbox-password').value;
            const debugDiv = document.getElementById('login-debug');
            const debugAlert = debugDiv.querySelector('.alert');

            debugDiv.classList.remove('d-none');
            debugAlert.textContent = 'Attempting login...';
            debugAlert.className = 'alert alert-info small';

            tokenManager.login(username, password)
                .then(() => {
                    debugAlert.textContent = 'Login successful! Reloading CKBox...';
                    debugAlert.className = 'alert alert-success small';
                    setTimeout(() => {
                        const overlay = document.querySelector('.ck-login-overlay');
                        if (overlay) {
                            overlay.remove();
                        }
                        initializeEditorWithCKBox();
                    }, 1000);
                })
                .catch(error => {
                    debugAlert.textContent = `Login failed: ${error.message}`;
                    debugAlert.className = 'alert alert-danger small';
                });
        }

        function showLoginOverlay() {
            const existingOverlay = document.querySelector('.ck-login-overlay');
            if (!existingOverlay) {
                //existingOverlay.remove();
                const overlay = document.createElement('div');
                overlay.className = 'ck-login-overlay ck-login-overlay';
                overlay.innerHTML = `
                          <style>
                            .ck-login-overlay {
                                position: fixed;
                                top: 0;
                                left: 0;
                                width: 100%;
                                height: 100%;
                                z-index: 999999 !important;
                            }
                            .ck-login-overlay .modal {
                                z-index: 1000000 !important;
                            }
                            .ck-login-overlay .modal-backdrop {
                                z-index: 999998 !important;
                            }
                        </style>
                        <div class="modal fade show d-block" tabindex="-1" role="dialog">
                            <div class="modal-dialog modal-dialog-centered" role="document">
                                <div class="modal-content">
                                    <div class="modal-header border-0">
                                        <h5 class="modal-title">Login To Your System</h5>
                                    </div>
                                    <div class="modal-body">
                                        <form id="ckbox-login-form">
                                            <div class="mb-3">
                                                <label for="ckbox-username" class="form-label">Username</label>
                                                <input type="text" class="form-control" id="ckbox-username">
                                            </div>
                                            <div class="mb-3">
                                                <label for="ckbox-password" class="form-label">Password</label>
                                                <input type="password" class="form-control" id="ckbox-password">
                                            </div>
                                            <div class="d-flex justify-content-end">
                                                <button type="submit" class="btn btn-primary">Login</button>
                                            </div>
                                        </form>
                                        <div class="mt-3 d-none" id="login-debug">
                                            <div class="alert alert-info small"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-backdrop fade show"></div>
                    `;

                //document.body.appendChild(overlay);
                document.body.prepend(overlay);
                // Tambahkan event listener untuk form login
                const loginForm = document.getElementById('ckbox-login-form');
                if (loginForm) {
                    // Hapus event listener yang ada sebelumnya untuk mencegah duplikasi
                    loginForm.removeEventListener('submit', handleLoginSubmit);
                    // Tambahkan event listener baru
                    loginForm.addEventListener('submit', handleLoginSubmit);
                }
            } else {
                console.log('Halaman Login Sudah di load');
                return null;
            }
        }


        // Create token URL function for CKBox
        function createTokenUrlFunction() {
            return async () => {
                try {
                    console.log('CKBox requesting token...');
                    let token = await tokenManager.getTokenForCKBox();
                    console.log('CKBox token obtained successfully');
                    console.log('CKBox token:', token ? token.substring(0, 20) + '...' : 'null');
                    return token;
                } catch (error) {
                    console.log(`CKBox token error: ${error.message}`);
                    console.log('token kosong', tokenManager.getToken());
                    showLoginOverlay();
                    return null;
                }
            };
        }

        // Create token refresh function for CKBox
        function createTokenRefreshFunction() {
            return async (oldToken) => {
                try {
                    console.log('CKBox refreshing token...');
                    console.log(`Old token: ${oldToken ? oldToken.substring(0, 20) + '...' : 'null'}`);
                    const newToken = await tokenManager.refreshAccessToken();

                    if (newToken) {
                        console.log('CKBox token refreshed successfully');
                        console.log('New CKBox token:', newToken.substring(0, 20) + '...');
                        return newToken;
                    }

                    throw new Error('Token refresh failed');
                } catch (error) {
                    console.log(`CKBox token refresh error: ${error.message}`);
                    showLoginOverlay();
                    return null;
                }
            };
        }

    window.currentEditor = editor;
    editor.model.document.on('change:data',()=>updateInputValue(editor));
    const inputElement=document.getElementById(inputId);
    if(inputElement?.form) inputElement.form.addEventListener('submit',()=>updateInputValue(editor));
    editor.editing.view.document.on('keydown',(event,data)=>{ if(data.domEvent.key===' ') data.domEvent.preventDefault(); },{priority:'high'});
  }).catch(error=>console.error(`Error initializing CKEditor without CKBox: ${error.message}`, error));
}
        // Initialize when the page is fully loaded
        initializeTokenManager();
        const token = tokenManager.getToken();
        if (token && tokenManager.isTokenValid()) {
            initializeEditorWithCKBox();
        } else {
            showLoginOverlay();
            initializeEditorWithoutCKBox();
        }
    });
</script>
