    // Enhanced Token Manager with improved refresh handling
    class SimpleTokenManager {
        constructor(config = {}) {
            this.config = {
                tokenUrl: config.tokenUrl || '/api/auth/ckbox_login',
                refreshTokenUrl: config.refreshTokenUrl || '/api/auth/ckbox_token_refresh',
                ...config
            };
            this.token = null;
            this.refreshToken = null;
            this.tokenExpiry = null;
            this.refreshTokenExpiry = null;
            this.refreshTimeout = null;
            this.isRefreshing = false;
            this.refreshQueue = [];
        }

        getToken() {
            const tokenData = localStorage.getItem('ckeditor_token');

            if (tokenData) {
                try {
                    const parsed = JSON.parse(tokenData);
                    this.token = parsed.token;
                    this.refreshToken = parsed.refreshToken;
                    this.tokenExpiry = parsed.expiry;
                    this.refreshTokenExpiry = parsed.refreshExpiry;

                    return this.token;
                } catch (e) {
                    this.clearToken();
                }
            }
            return null;
        }

        saveToken(token, refreshToken, expiry, refreshExpiry) {
            const tokenData = {
                token,
                refreshToken,
                expiry,
                refreshExpiry
            };
            localStorage.setItem('ckeditor_token', JSON.stringify(tokenData));

            this.token = token;
            this.refreshToken = refreshToken;
            this.tokenExpiry = expiry;
            this.refreshTokenExpiry = refreshExpiry;

            this.setAutoRefresh();
        }

        clearToken() {
            localStorage.removeItem('ckeditor_token');
            this.token = null;
            this.refreshToken = null;
            this.tokenExpiry = null;
            this.refreshTokenExpiry = null;
            if (this.refreshTimeout) {
                clearTimeout(this.refreshTimeout);
                this.refreshTimeout = null;
            }
        }

        isTokenValid() {
            if (!this.tokenExpiry) return false;
            // Add a small buffer (5 seconds) to account for network latency
            return Date.now() < (this.tokenExpiry - 5000);
        }

        isRefreshTokenValid() {
            if (!this.refreshTokenExpiry) return false;
            return Date.now() < this.refreshTokenExpiry;
        }

        setAutoRefresh() {
            if (this.refreshTimeout) {
                clearTimeout(this.refreshTimeout);
            }

            if (!this.tokenExpiry) return;

            // Try to refresh 30 seconds before expiry
            const refreshTime = Math.max(0, this.tokenExpiry - Date.now() - 30 * 1000);

            this.refreshTimeout = setTimeout(() => {
                this.refreshAccessToken();
            }, refreshTime);
        }

        async refreshAccessToken() {
            // If already refreshing, return the same promise
            if (this.isRefreshing) {
                return new Promise((resolve, reject) => {
                    this.refreshQueue.push({resolve, reject});
                });
            }

            this.isRefreshing = true;

            // Check if we have a valid refresh token
            if (!this.refreshToken || !this.isRefreshTokenValid()) {
                this.clearToken();
                this.isRefreshing = false;
                return null;
            }

            try {
                const url = `${config.baseUrl}${this.config.refreshTokenUrl}`;
                console.log('Refreshing access token...');

                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({refresh: this.refreshToken})
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Token refresh successful');

                    // Calculate expiry times based on server response
                    const tokenExpiry = Date.now() + (data.access_token_lifetime * 1000);
                    const refreshExpiry = Date.now() + (data.refresh_token_lifetime * 1000);

                    this.saveToken(
                        data.access,
                        data.refresh || this.refreshToken,
                        tokenExpiry,
                        refreshExpiry
                    );

                    // Resolve all queued promises
                    this.refreshQueue.forEach(({resolve}) => resolve(this.token));
                    this.refreshQueue = [];

                    this.isRefreshing = false;
                    return this.token;
                } else {
                    console.error('Refresh token failed with status:', response.status);
                    this.clearToken();

                    // Reject all queued promises
                    this.refreshQueue.forEach(({reject}) => reject(new Error('Token refresh failed')));
                    this.refreshQueue = [];

                    this.isRefreshing = false;
                    return null;
                }
            } catch (error) {
                console.error('Error refreshing token:', error);
                this.clearToken();

                // Reject all queued promises
                this.refreshQueue.forEach(({reject}) => reject(error));
                this.refreshQueue = [];

                this.isRefreshing = false;
                return null;
            }
        }

        async getTokenForCKBox() {
            let token = this.getToken();

            // If token is not available or not valid, try to refresh
            if (!token || !this.isTokenValid()) {
                try {
                    token = await this.refreshAccessToken();

                    // If refresh failed and we have a valid refresh token, try one more time
                    if (!token && this.isRefreshTokenValid()) {
                        console.log('First refresh failed, trying again...');
                        token = await this.refreshAccessToken();
                    }

                    // If still no token after refresh attempts, show login
                    if (!token) {
                        throw new Error('Unable to refresh token');
                    }
                } catch (error) {
                    console.error('Token refresh failed:', error);
                    throw new Error('Token refresh failed');
                }
            }

            return token;
        }

        async login(username, password) {
            try {
                const url = `${config.baseUrl}${this.config.tokenUrl}`;

                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({username, password})
                });

                if (response.ok) {
                    const data = await response.json();

                    // Calculate expiry times based on server response
                    const tokenExpiry = Date.now() + (data.access_token_lifetime * 1000);
                    const refreshExpiry = Date.now() + (data.refresh_token_lifetime * 1000);

                    this.saveToken(
                        data.access,
                        data.refresh,
                        tokenExpiry,
                        refreshExpiry
                    );
                    return true;
                } else {
                    let errorMessage = 'Login failed';
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        errorMessage = await response.text();
                    }
                    throw new Error(errorMessage);
                }
            } catch (error) {
                throw error;
            }
        }

        logout() {
            this.clearToken();
        }
    }

    // Show login overlay
    function showLoginOverlay() {
        // Remove existing overlay
        const existingOverlay = document.querySelector('.ck-login-overlay');
        if (existingOverlay) {
            existingOverlay.remove();
        }

        // Create new overlay
        const overlay = document.createElement('div');
        overlay.className = 'ck-login-overlay';
        overlay.innerHTML = `
            <div class="ck-login-form">
                <h3>Login to your System</h3>
                <form id="ckeditor-login-form">
                    <div class="ck-form-group">

                    </div>
                </form>
                <div class="debug-info" id="login-debug"></div>
            </div>
        `;

        document.body.appendChild(overlay);

        // Handle form submission
        document.getElementById('ckeditor-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('ckeditor-username').value;
            const password = document.getElementById('ckeditor-password').value;
            const debugDiv = document.getElementById('login-debug');

            debugDiv.textContent = 'Attempting login...';

            try {
                await tokenManager.login(username, password);
                debugDiv.textContent = 'Login successful!';
                overlay.remove();
                updateStatus('Logged in successfully');

                // Show logout button
                const logoutButton = document.getElementById('logout-button');
                logoutButton.style.display = 'block';

                // Initialize CKBox if editor exists
                if (window.currentEditor) {
                    initializeCKBox(window.currentEditor);
                }
            } catch (error) {
                debugDiv.textContent = `Login failed: ${error.message}`;
                alert(`Login failed: ${error.message}`);
            }
        });

        // Handle cancel button
        document.getElementById('cancel-login').addEventListener('click', () => {
            overlay.remove();
        });
    }

    // Initialize CKBox in existing editor
    function initializeCKBox(editor) {
        // Create token URL function for CKBox
        const tokenUrlFunction = async () => {
            try {
                let token = await tokenManager.getTokenForCKBox();
                return token;
            } catch (error) {
                console.error('CKBox token error:', error);
                // Only show login if refresh token is also invalid
                if (!tokenManager.isRefreshTokenValid()) {
                    showLoginOverlay();
                }
                throw error;
            }
        };

        // Create token refresh function for CKBox
        const tokenRefreshFunction = async (oldToken) => {
            try {
                const newToken = await tokenManager.refreshAccessToken();
                if (newToken) {
                    console.log('CKBox token refreshed successfully');
                    return newToken;
                }

                // If refresh failed, check if we should show login
                if (!tokenManager.isRefreshTokenValid()) {
                    console.log('Refresh token invalid, showing login');
                    showLoginOverlay();
                }

                throw new Error('Token refresh failed');
            } catch (error) {
                console.error('CKBox token refresh error:', error);
                // Only show login if refresh token is also invalid
                if (!tokenManager.isRefreshTokenValid()) {
                    showLoginOverlay();
                }
                throw error;
            }
        };

        // Update CKBox configuration
        editor.config.set('ckbox.tokenUrl', tokenUrlFunction);
        editor.config.set('ckbox.onTokenRefresh', tokenRefreshFunction);

        // Reinitialize CKBox plugin
        const ckboxPlugin = editor.plugins.get('CKBox');
        if (ckboxPlugin) {
            ckboxPlugin.init();
        }

        // Enable CKBox button in toolbar
        const toolbar = editor.ui.view.toolbar;
        const ckboxButton = toolbar.items.find(item => item.label === 'Insert image');
        if (ckboxButton) {
            ckboxButton.isEnabled = true;
        }

        updateStatus('CKBox initialized');
    }

    function createTokenUrlFunction() {
        return async () => {
            try {
                let token = await tokenManager.getTokenForCKBox();
                return token;
            } catch (error) {
                console.error('CKBox token error:', error);
                // Only show login if refresh token is also invalid
                if (!tokenManager.isRefreshTokenValid()) {
                    showLoginOverlay();
                }
                throw error;
            }
        };
    }

    // Create token refresh function for CKBox
    function createTokenRefreshFunction() {
        return async (oldToken) => {
            try {
                console.log('CKBox requesting token refresh...');
                const newToken = await tokenManager.refreshAccessToken();

                if (newToken) {
                    console.log('CKBox token refreshed successfully');
                    return newToken;

                // If refresh failed, check if we should show login
                if (!tokenManager.isRefreshTokenValid()) {
                    console.log('Refresh token invalid, showing login');
                    showLoginOverlay();
                }

                throw new Error('Token refresh failed');
            } catch (error) {
                console.error('CKBox token refresh error:', error);
                // Only show login if refresh token is also invalid
                if (!tokenManager.isRefreshTokenValid()) {
                    showLoginOverlay();
                }
                throw error;
            }
        };
    }

                        'blockQuote', 'insertTable', '|', 'sourceEditing', 'fullscreen', '|',
                        'findAndReplace'
                    ]
                })
                .then(editor => {
                    updateStatus('CKEditor initialized without CKBox');
                    window.currentEditor = editor;
                })
                .catch(error => {
                    updateStatus('Error initializing CKEditor without CKBox');
                    console.error('Error initializing CKEditor without CKBox:', error);
                });
        }

        // Logout button handler - modified to not reload page
        logoutButton.addEventListener('click', () => {
            tokenManager.logout();
            logoutButton.style.display = 'none';
            updateStatus('Logged out');

            // Show login overlay without reloading page
            showLoginOverlay();

            // Disable CKBox in the current editor
            if (window.currentEditor) {
                // Remove CKBox from toolbar
                const toolbar = window.currentEditor.ui.view.toolbar;
                const ckboxButton = toolbar.items.find(item => item.label === 'Insert image');
                if (ckboxButton) {
                    ckboxButton.isEnabled = false;
                }
            }
        });
    });
</script>
</body>
</html>
